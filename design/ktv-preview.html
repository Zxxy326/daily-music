<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KTV 模式 · 效果预览</title>
<style>
  @font-face{
    font-family:"FangYuan";
    src:url("fonts/alimama_fangyuan.ttf") format("truetype");
    font-weight:400 700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;
         font-family:"FangYuan","PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}

  /* 背景：歌曲的横向封面，模糊压暗 */
  #cover{position:absolute;inset:-6%;width:112%;height:112%;
         background-size:cover;background-position:center;
         filter:blur(16px) saturate(1.12);transform:scale(1.04)}
  #veil{position:absolute;inset:0;
        background:linear-gradient(180deg,rgba(0,0,0,.40) 0%,rgba(0,0,0,.26) 40%,rgba(0,0,0,.70) 100%)}

  /* 歌名：只描边 + 下面一行歌手 */
  #titleblock{position:absolute;left:0;right:0;top:14%;text-align:center}
  #title{
    font-size:15.5vh;font-weight:700;letter-spacing:.03em;
    color:transparent;
    -webkit-text-stroke:1.5px rgba(255,255,255,.66);
    line-height:1;white-space:nowrap;overflow:hidden;
  }
  #artist{
    margin-top:1.8vh;
    font-size:1.85vh;letter-spacing:.18em;
    color:rgba(255,255,255,.60);
  }

  /* 两句歌词：左边上一句（高一点），右边下一句（低一点），像台阶 */
  .line{
    position:absolute;
    font-size:4.7vh;font-weight:700;line-height:1.26;
    color:#fff;
    text-shadow:
      -2px -2px 0 rgba(0,0,0,.92), 2px -2px 0 rgba(0,0,0,.92),
      -2px 2px 0 rgba(0,0,0,.92), 2px 2px 0 rgba(0,0,0,.92),
      0 0 3px rgba(0,0,0,.9), 0 6px 16px rgba(0,0,0,.5);
  }
  #l1{left:8.5%;top:63%;width:62%}
  #l2{left:41%;top:75%;width:54%;color:rgba(255,255,255,.80)}
  .on{color:var(--accent,#6CFFB0)}

  /* 底部控制区：5 秒后自动隐藏，点一下唤回 */
  .chrome{position:absolute;left:5.4%;right:5.4%;bottom:6%;
          display:flex;align-items:center;gap:2.2vh;
          transition:opacity .45s ease, transform .45s ease}
  .chrome.hide{opacity:0;transform:translateY(3vh);pointer-events:none}
  .thumb{width:6.6vh;height:6.6vh;border-radius:1.1vh;object-fit:cover;
         box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .meta{display:flex;flex-direction:column;gap:.5vh;min-width:0}
  .meta .t{font-size:2.1vh;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:1.65vh;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:3.4vh;color:#fff}
  .ctl svg{height:3.4vh;width:auto;display:block}
  .bar{position:absolute;left:5.4%;right:5.4%;bottom:2.4%;height:2px;background:rgba(255,255,255,.16);border-radius:2px;
       transition:opacity .45s ease}
  .bar.hide{opacity:0}
  .bar i{display:block;height:100%;width:38%;background:#fff;border-radius:2px}
</style>
</head>
<body>
<div id="stage">
  <div id="cover"></div>
  <div id="veil"></div>

  <div id="titleblock">
    <div id="title">STAY</div>
    <div id="artist">THE KID LAROI · JUSTIN BIEBER</div>
  </div>

  <div class="line" id="l1"><span class="on">Lyrics by:</span> Justin Bieber/Charlton</div>
  <div class="line" id="l2">Howard/Blake Slatkin/Omer Fedi</div>

  <div class="chrome" id="chrome">
    <img class="thumb" id="thumb">
    <div class="meta">
      <div class="t" id="song">STAY</div>
      <div class="a" id="artist2">The Kid LAROI, Justin Bieber</div>
    </div>
    <div class="spacer"></div>
    <div class="ctl">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14l-11-7zM18 5h2v14h-2z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.6 12 20 12 20z"/></svg>
    </div>
  </div>
  <div class="bar" id="bar"><i></i></div>
</div>

<script>
/* ---------------- 封面 ---------------- */
function fakeCover(){
  const c=document.createElement('canvas'); c.width=600; c.height=600;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,600,600);
  g.addColorStop(0,'#12161c'); g.addColorStop(.5,'#243040'); g.addColorStop(1,'#3a4a5c');
  x.fillStyle=g; x.fillRect(0,0,600,600);
  for(let i=0;i<6;i++){
    const rg=x.createRadialGradient(Math.random()*600,Math.random()*600,0,
                                    Math.random()*600,Math.random()*600,120+Math.random()*220);
    rg.addColorStop(0,'rgba(200,190,170,.30)'); rg.addColorStop(1,'transparent');
    x.fillStyle=rg; x.fillRect(0,0,600,600);
  }
  const img=x.getImageData(0,0,600,600), d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*20; d[i]+=n; d[i+1]+=n; d[i+2]+=n;}
  x.putImageData(img,0,0);
  return c.toDataURL();
}
const cover=fakeCover();
document.getElementById('cover').style.backgroundImage=`url(${cover})`;
document.getElementById('thumb').src=cover;

/* ---------------- 第一句逐字点亮 ---------------- */
const l1=document.getElementById('l1');
const raw=l1.textContent;
l1.textContent='';
const spans=[...raw].map(ch=>{
  const s=document.createElement('span'); s.textContent=ch; l1.appendChild(s); return s;
});
const q=new URLSearchParams(location.search);
let played=q.has('line')? +q.get('line') : 0;
function paint(){ spans.forEach((s,i)=>s.classList.toggle('on', i<played)); }
paint();
if(!q.has('line')){
  setInterval(()=>{
    played++;
    if(played>spans.length+10) played=0;
    paint();
  }, 110);
}

/* ---------------- 控制区 5 秒自动隐藏 ---------------- */
const chromeEl=document.getElementById('chrome'), barEl=document.getElementById('bar');
let hideTimer;
function showChrome(){
  chromeEl.classList.remove('hide'); barEl.classList.remove('hide');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ chromeEl.classList.add('hide'); barEl.classList.add('hide'); },5000);
}
if(q.get('chrome')==='1'){
  chromeEl.classList.remove('hide'); barEl.classList.remove('hide');
} else {
  showChrome();
  document.getElementById('stage').addEventListener('click',showChrome);
}
if(q.has('title')) document.getElementById('title').textContent=q.get('title');
</script>
</body>
</html>
