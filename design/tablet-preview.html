<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>平板模式 · 效果预览</title>
<style>
  @font-face{
    font-family:"FangYuan";
    src:url("fonts/alimama_fangyuan.ttf") format("truetype");
    font-weight:400 700;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#E9E9EF;overflow:hidden;
            font-family:"FangYuan","PingFang SC","Microsoft YaHei",sans-serif}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;
         background:
           radial-gradient(60% 50% at 22% 8%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
           radial-gradient(70% 60% at 82% 0%, #E4EEFF 0%, rgba(228,238,255,0) 55%),
           radial-gradient(50% 40% at 95% 100%, #FFE9F2 0%, rgba(255,233,242,0) 60%),
           #F2F2F7;}

  /* ---------------- 左侧栏 ---------------- */
  .rail{
    position:absolute;left:1.6vh;top:50%;transform:translateY(-50%);
    width:9.4vh;border-radius:3vh;padding:1.5vh 1.1vh;
    display:flex;flex-direction:column;align-items:center;gap:1vh;
    background:rgba(255,255,255,.66);
    border:1px solid rgba(255,255,255,.72);
    box-shadow:0 14px 34px rgba(0,0,0,.10);
    backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
  }
  .rail .item{
    width:100%;height:8.2vh;border-radius:2.2vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;
    color:#7A7A82;font-size:1.6vh;font-weight:500;cursor:pointer;
    transition:background .2s,color .2s;
  }
  .rail .item svg{width:2.6vh;height:2.6vh}
  .rail .item.on{color:#4B6BFB;background:rgba(75,107,251,.13)}
  .rail .item:hover{color:#3C3C44}

  /* ---------------- 内容 ---------------- */
  .content{position:absolute;left:12.6vh;right:1.6vh;top:0;bottom:0;
           padding:3.2vh 1.6vh 12vh;overflow:hidden}
  .head{display:flex;align-items:flex-start;justify-content:space-between}
  .h1{font-size:5.2vh;font-weight:800;letter-spacing:-.035em;color:#15151A;line-height:1.1}
  .sub{margin-top:1.1vh;font-size:1.9vh;color:#8A8A93}
  .avatar{width:6.4vh;height:6.4vh;border-radius:50%;
          background:linear-gradient(135deg,#FF7A59,#B14BFF);
          box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .search{
    margin-top:2.6vh;height:7vh;border-radius:3.5vh;
    background:rgba(255,255,255,.82);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 8px 22px rgba(0,0,0,.05);
    display:flex;align-items:center;gap:1.6vh;padding:0 2.6vh;
    color:#9A9AA3;font-size:2.1vh;
  }
  .entries{margin-top:2.2vh;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vh}
  .entry{height:11vh;border-radius:2.4vh;background:rgba(255,255,255,.66);
         border:1px solid rgba(255,255,255,.75);
         box-shadow:0 10px 24px rgba(0,0,0,.05);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;
         font-size:2vh;color:#2A2A31;font-weight:600}
  .entry .dot{width:5.4vh;height:5.4vh;border-radius:1.6vh;display:flex;align-items:center;justify-content:center}
  .entry .dot svg{width:2.8vh;height:2.8vh;color:#fff}
  .sec{margin-top:2.6vh;display:flex;align-items:baseline;justify-content:space-between}
  .sec b{font-size:2.6vh;font-weight:800;color:#15151A;letter-spacing:-.02em}
  .sec span{font-size:1.7vh;color:#9A9AA3}
  .cards{margin-top:1.6vh;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vh}
  .card .cov{aspect-ratio:1;border-radius:2.2vh;background:linear-gradient(140deg,#C9D6FF,#E2C9FF)}
  .card:nth-child(2) .cov{background:linear-gradient(140deg,#FFD9A8,#FF9A8B)}
  .card:nth-child(3) .cov{background:linear-gradient(140deg,#A8E6CF,#4ECDC4)}
  .card:nth-child(4) .cov{background:linear-gradient(140deg,#FFE29F,#FFA99F)}
  .card:nth-child(5) .cov{background:linear-gradient(140deg,#B5C6FF,#8FA3FF)}
  .card p{margin-top:1vh;font-size:1.75vh;color:#2A2A31;font-weight:600;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------------- 底部播放条 ---------------- */
  .mini{
    position:absolute;left:12.6vh;right:1.6vh;bottom:1.6vh;height:9.2vh;
    border-radius:3vh;                   /* 与左侧栏统一 */
    background:rgba(255,255,255,.70);
    border:1px solid rgba(255,255,255,.78);
    box-shadow:0 16px 38px rgba(0,0,0,.14);
    backdrop-filter:blur(26px) saturate(1.7);
    -webkit-backdrop-filter:blur(26px) saturate(1.7);
    display:flex;align-items:center;gap:2.2vh;padding:0 2.4vh;
  }
  .disc{
    width:6.6vh;height:6.6vh;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(from 0deg,#2A2A31,#4A4A55,#2A2A31,#5A5A66,#2A2A31);
    box-shadow:0 6px 16px rgba(0,0,0,.28), inset 0 0 0 .5vh rgba(255,255,255,.10);
    animation:spin 18s linear infinite;
  }
  .disc::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#FF8A4C 0 26%,transparent 27%);
  }
  .disc::before{
    content:"";position:absolute;left:50%;top:50%;width:.9vh;height:.9vh;border-radius:50%;
    background:#1A1A20;transform:translate(-50%,-50%);z-index:2;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .meta{width:20vh;flex:none;min-width:0}
  .meta .t{font-size:2.1vh;font-weight:700;color:#15151A;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .a{font-size:1.65vh;color:#8A8A93;margin-top:.4vh;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .sep{width:1px;height:4.6vh;background:rgba(0,0,0,.10);flex:none}

  /* 歌词轮播：一次只显示一句，到点往上翻 */
  .lyric{
    flex:1;min-width:0;overflow:hidden;position:relative;height:100%;
    padding-left:3.2vh;
    /* 只在右侧做溢出渐隐：左侧是歌词起点，渐隐会把第一个字吃掉 */
    -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 96%,transparent 100%);
    mask-image:linear-gradient(90deg,#000 0%,#000 96%,transparent 100%);
  }
  .lyric .line{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    font-size:2.5vh;font-weight:600;
    white-space:nowrap;overflow:hidden;
    opacity:1;animation:lyricFlip 8s ease-in-out infinite;
    /* 逐字扫色：--p 由 JS 推进，前 7% 是过渡带，光顺着字往前淌 */
    --p:0%;
    background-image:linear-gradient(90deg,
      #4B6BFB 0%, #4B6BFB var(--p), #8C8C95 calc(var(--p) + 7%), #8C8C95 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .lyric .line em{font-style:normal}
  .lyric .line:nth-child(2){animation-delay:-4s}
  @keyframes lyricFlip{
    0%{opacity:1;transform:translateY(-50%)}
    43%{opacity:1;transform:translateY(-50%)}
    50%{opacity:0;transform:translateY(-92%)}
    93%{opacity:0;transform:translateY(-8%)}
    100%{opacity:1;transform:translateY(-50%)}
  }

  .ctl{display:flex;align-items:center;gap:1.2vh;flex:none}
  .btn{width:5.4vh;height:5.4vh;border-radius:50%;display:flex;align-items:center;justify-content:center;
       color:#3A3A42;cursor:pointer;transition:background .18s}
  .btn:hover{background:rgba(0,0,0,.06)}
  .btn svg{width:2.7vh;height:2.7vh}
  .btn.play{background:#15151A;color:#fff;width:6.2vh;height:6.2vh;box-shadow:0 8px 20px rgba(0,0,0,.22)}
  .btn.play svg{width:3vh;height:3vh}
  .btn.fav{color:#F0455E}
</style>
</head>
<body>
<div id="stage">

  <!-- 左侧栏：恢复成原来的四项 -->
  <div class="rail">
    <div class="item on">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>首页</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>搜索</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h2v14H4zm5 0h2v14H9zm5 0h2v14h-2zm5 0h2v14h-2z"/></svg>
      <span>音乐库</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>我的</span>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content">
    <div class="head">
      <div>
        <div class="h1">Daily Music</div>
        <div class="sub">早上好，听点什么</div>
      </div>
      <div class="avatar"></div>
    </div>

    <div class="search">
      <svg width="2.4vh" height="2.4vh" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      搜索歌曲、歌手、歌单
    </div>

    <div class="entries">
      <div class="entry"><div class="dot" style="background:#FFB020">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </div>每日推荐</div>
      <div class="entry"><div class="dot" style="background:#4B6BFB">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
      </div>排行榜</div>
      <div class="entry"><div class="dot" style="background:#8B5CF6">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </div>歌单广场</div>
      <div class="entry"><div class="dot" style="background:#22C08A">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </div>识曲</div>
    </div>

    <div class="sec"><b>推荐歌单</b><span>换一批</span></div>
    <div class="cards">
      <div class="card"><div class="cov"></div><p>夜深了，听点什么</p></div>
      <div class="card"><div class="cov"></div><p>开车必备的公路歌单</p></div>
      <div class="card"><div class="cov"></div><p>华语流行精选</p></div>
      <div class="card"><div class="cov"></div><p>午后咖啡与爵士</p></div>
      <div class="card"><div class="cov"></div><p>安静写代码</p></div>
    </div>
  </div>

  <!-- 底部播放条 -->
  <div class="mini">
    <div class="disc"></div>
    <div class="meta">
      <div class="t">他不懂</div>
      <div class="a">张杰</div>
    </div>
    <div class="sep"></div>
    <div class="lyric">
      <div class="line">他不懂你的心 假装冷静</div>
      <div class="line">他不懂爱情把它当游戏</div>
    </div>
    <div class="ctl">
      <div class="btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </div>
      <div class="btn play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
      <div class="btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </div>
      <div class="btn fav">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.4-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7 2.7C19 15.6 12 21 12 21z"/></svg>
      </div>
    </div>
  </div>

</div>
<script>
// 逐字扫色：每句 4 秒，前 3.6 秒唱完，剩下 0.4 秒留白等翻页
const lyricLines = [...document.querySelectorAll('.lyric .line')];
const CYCLE = 8000, PER = 4000, SING = 3600;
const t0 = performance.now();
function tick(now){
  const phase = (now - t0) % CYCLE;
  lyricLines.forEach((el, i) => {
    const local = (phase - i * PER + CYCLE) % CYCLE;
    const p = Math.min(1, local / SING);
    el.style.setProperty('--p', (p * 100).toFixed(2) + '%');
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
